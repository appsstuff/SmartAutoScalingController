# Deploys your autoscaler as a scheduled CronJob in Kubernetes.
    # Schedules autoscaler to run every minute
    # Sets environment variables for deployment
    # Uses your custom Docker image
    # Safe restart policy and pull strategy

apiVersion: batch/v1
kind: CronJob
metadata:
  name: smart-autoscaler-job
  namespace: monitoring
spec:
  schedule: "*/* 24 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure  # Correct placement here
          containers:
            - name: autoscaler
              image: gcr.io/cairo-university-457016/autoscaling-controller:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "retrain_models.py"]
              envFrom:
                - configMapRef:
                    name: smart-autoscaler-global-config
              volumeMounts:
                - name: autoscaler-data
                  mountPath: /data
                - name: autoscaler-data
                  mountPath: /app/models
          volumes:
            - name: autoscaler-data
              persistentVolumeClaim:
                claimName: autoscaler-data-pvc
