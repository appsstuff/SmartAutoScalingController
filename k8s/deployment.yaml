apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-autoscaler
  namespace: monitoring
  labels:
    app: smart-autoscaler
    release: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-autoscaler
      target: development
      release: prometheus
  template:
    metadata:
      labels:
        app: smart-autoscaler
        target: development
        release: prometheus
    spec:
      serviceAccountName: autoscaler-sa
      containers:
        - name: autoscaler
          image: gcr.io/cairo-university-457016/autoscaling-controller:latest
          command: ["python", "autoscaler_controller.py"]
          imagePullPolicy: Always
          ports:
          - containerPort: 8900
            name: metrics
          - containerPort: 8901
            name: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8901
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8901
            initialDelaySeconds: 10
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: smart-autoscaler-global-config
          volumeMounts:
            - name: autoscaler-data
              mountPath: /data
      volumes:
        - name: autoscaler-data
          persistentVolumeClaim:
            claimName: autoscaler-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: smart-autoscaler
  namespace: monitoring
spec:
  selector:
    app: smart-autoscaler
    
  ports:
    - protocol: TCP
      port: 8900
      targetPort: 8900
      name: metrics
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: smart-autoscaler-monitor
  namespace: monitoring
  labels:
    release: prometheus
    app: smart-autoscaler
   
spec:
  jobLabel: smart-autoscaler
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
  selector:
    matchLabels:
      app: smart-autoscaler
  namespaceSelector:
    matchNames:
          - monitoring

--- 
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: smart-autoscaler-pod-monitor
  namespace: monitoring
  labels:
    release: prometheu
    app: smart-autoscaler
spec:
  jobLabel: smart-autoscaler
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
  selector:
    matchLabels:
      app: smart-autoscaler
  namespaceSelector:
    matchNames:
      - monitoring

---
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: autoscaler-cluster-role
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: autoscaler-role-binding
subjects:
  - kind: ServiceAccount
    name: autoscaler-sa
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: autoscaler-cluster-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autoscaler-sa
  namespace: monitoring
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autoscaler-data-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
