apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: keda-operator-servicemonitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: keda-operator
  namespaceSelector:
    matchNames:
      - keda
  endpoints:
    - port: metricsservice   # ✅ correct port name
      path: /metrics
      interval: 15s

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: smart-autoscaler-keda-adservice
  namespace: default
spec:
  scaleTargetRef:
    name: adservice
    kind: Deployment
  minReplicaCount: 1
  maxReplicaCount: 4
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://vm-victoria-metrics-single-server.monitoring.svc.cluster.local:8428
        metricName: autoscaler_decision
        threshold: "0.8"
        activationThreshold: "0.2" 
        query: 'autoscaler_decision{service="adservice"}'
--- 

